# ============================================================
#  SNSスケジューラー 設定ファイル
#  このファイルを編集するだけで、コードを触らずにカスタマイズできます。
# ============================================================

# ── 会社・ブランド情報 ────────────────────────────────────
company:
  name: 株式会社IMADOKI
  industry: AIマーケティング・SNS運用支援
  url: https://imadoki.co.jp

# ── ブランドカラー・ロゴ設定 ──────────────────────────────
# 生成される画像（インフォグラフィック）のデザインを自社カラーに変更できます。
branding:
  # グラフ・枠線・アクティブ要素のメインカラー
  primary_color: "#6366f1"   # 例: "#0ea5e9"（空色）"#10b981"（緑）"#8b5cf6"（紫）

  # 数値・ハイライト・アクセントカラー
  accent_color: "#fbbf24"    # 例: "#f97316"（オレンジ）"#ec4899"（ピンク）"#facc15"（黄）

  # ロゴ画像のURL（空白=会社名テキストを表示）
  # 例: "https://example.com/logo.png"
  logo_url: ""

  # 画像右下に表示する会社名（logo_url が空のときに使用）
  company_name: "株式会社IMADOKI"

# ── 投稿スタイル ──────────────────────────────────────────
content:
  # ターゲット読者（Claudeへの指示に使用）
  target_audience: 中小企業経営者・マーケター・20〜40代ビジネスパーソン

  # 投稿トーン（Claudeへの指示に使用）
  tone: 親しみやすい・専門用語なし・友達に話すような口調

  # 1日に生成する投稿数
  posts_per_day: 5

  # 投稿文字数（文字）
  post_length_min: 200
  post_length_max: 400

  # ハッシュタグ数・絵文字数の上限
  hashtags_per_post: 1
  emoji_per_post: 2

  # 禁止表現（Claudeへの指示）
  forbidden:
    - カタカナ専門用語の羅列
    - 上から目線の表現
    - 箇条書きで終わる投稿

# ── コンテンツトピック ────────────────────────────────────
topics:
  # メインテーマ（投稿内容のガイドとして使用）
  primary:
    - AI活用
    - SNS運用
    - マーケティング効率化

  # X（Twitter）での検索キーワード
  keywords_x:
    - AI活用
    - ChatGPT
    - SNS運用
    - WEBマーケティング

# ── RSSフィード ───────────────────────────────────────────
rss_feeds:
  - https://rss.itmedia.co.jp/rss/2.0/aiplus.xml
  - https://www.publickey1.jp/atom.xml
  - https://b.hatena.ne.jp/hotentry/it.rss
  - https://blog.hubspot.com/marketing/rss.xml
  - https://buffer.com/resources/feed/

# ── 投稿スケジュール（JST）─────────────────────────────────
schedule:
  times:
    - "09:00"
    - "12:00"
    - "18:00"
    - "20:00"
    - "22:00"

# ── Notionプロパティ名 ────────────────────────────────────
# Notionデータベースのプロパティ名を変更した場合はここを更新
notion:
  properties:
    text: 投稿文
    datetime: 投稿日時
    platform: 媒体
    status: ステータス
    image_url: 画像URL
    # 自動投稿後に記録されるツイートID
    tweet_id: X投稿ID
    # 毎日22時に自動計測されるエンゲージメント指標
    likes: いいね数
    retweets: RT数
    replies: リプライ数
    impressions: インプレッション
    analytics_date: 計測日時
  status:
    pending: 承認待ち
  platform:
    default: 両方
