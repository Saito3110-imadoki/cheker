# GitHub Secrets のプレフィックス（空文字 = 標準名を使用）
# 例: "IMADOKI" → IMADOKI_X_API_KEY, IMADOKI_NOTION_TOKEN ...
env_prefix: ""

company:
  name: 株式会社IMADOKI
  industry: AIマーケティング・SNS運用支援
