# ============================================================
#  SNSスケジューラー 設定ファイル
#  このファイルを編集するだけで、コードを触らずにカスタマイズできます。
# ============================================================

# ── 会社・ブランド情報 ────────────────────────────────────
company:
  name: 株式会社IMADOKI
  industry: AIマーケティング・SNS運用支援
  url: https://imadoki.co.jp

# ── 投稿スタイル ──────────────────────────────────────────
content:
  # ターゲット読者（Claudeへの指示に使用）
  target_audience: 中小企業経営者・マーケター・20〜40代ビジネスパーソン

  # 投稿トーン（Claudeへの指示に使用）
  tone: 親しみやすい・専門用語なし・友達に話すような口調

  # 1日に生成する投稿数
  posts_per_day: 5

  # 投稿文字数（文字）
  post_length_min: 200
  post_length_max: 400

  # ハッシュタグ数・絵文字数の上限
  hashtags_per_post: 1
  emoji_per_post: 2

  # 禁止表現（Claudeへの指示）
  forbidden:
    - カタカナ専門用語の羅列
    - 上から目線の表現
    - 箇条書きで終わる投稿

# ── コンテンツトピック ────────────────────────────────────
topics:
  # メインテーマ（投稿内容のガイドとして使用）
  primary:
    - AI活用
    - SNS運用
    - マーケティング効率化

  # X（Twitter）での検索キーワード
  keywords_x:
    - AI活用
    - ChatGPT
    - SNS運用
    - WEBマーケティング

# ── RSSフィード ───────────────────────────────────────────
rss_feeds:
  - https://rss.itmedia.co.jp/rss/2.0/aiplus.xml
  - https://www.publickey1.jp/atom.xml
  - https://b.hatena.ne.jp/hotentry/it.rss
  - https://blog.hubspot.com/marketing/rss.xml
  - https://buffer.com/resources/feed/

# ── 投稿スケジュール（JST）─────────────────────────────────
schedule:
  times:
    - "09:00"
    - "12:00"
    - "18:00"
    - "20:00"
    - "22:00"

# ── Notionプロパティ名 ────────────────────────────────────
# Notionデータベースのプロパティ名を変更した場合はここを更新
notion:
  properties:
    text: 投稿文
    datetime: 投稿日時
    platform: 媒体
    status: ステータス
    image_url: 画像URL
  status:
    pending: 承認待ち
  platform:
    default: 両方
