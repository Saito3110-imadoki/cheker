name: Multi-Client Post Generator

on:
  schedule:
    # 毎朝7時（JST）= 22:00 UTC
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      client:
        description: "クライアント設定ファイル名（例: imadoki）省略時は全件"
        required: false
        default: ""

jobs:
  # clients/*.yaml を一覧にして動的マトリクス化
  list-clients:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          if [ -n "${{ github.event.inputs.client }}" ]; then
            # 手動実行で特定クライアントを指定した場合
            echo "matrix={\"client\":[\"${{ github.event.inputs.client }}\"]}" >> $GITHUB_OUTPUT
          else
            # clients/*.yaml から sample_client を除いてリスト化
            files=$(ls clients/*.yaml 2>/dev/null | xargs -I{} basename {} .yaml | grep -v sample_client | jq -R . | jq -cs .)
            echo "matrix={\"client\":${files}}" >> $GITHUB_OUTPUT
          fi

  generate:
    needs: list-clients
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.list-clients.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: 日本語フォントのインストール
        run: sudo apt-get install -y fonts-noto-cjk -q

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: レイアウト判定（sns_scheduler/ or ルート直下）
        run: |
          if [ -f sns_scheduler/requirements.txt ]; then
            echo "BASE=sns_scheduler/" >> "$GITHUB_ENV"
          else
            echo "BASE=" >> "$GITHUB_ENV"
          fi

      - name: 依存ライブラリのインストール
        run: pip install -r "${BASE}requirements.txt"

      - name: Playwright Chromium インストール
        run: playwright install chromium --with-deps

      - name: 投稿生成（${{ matrix.client }}）
        env:
          # 標準シークレット（env_prefix="" のクライアント用）
          NOTION_TOKEN:                ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID:          ${{ secrets.NOTION_DATABASE_ID }}
          X_API_KEY:                   ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET:            ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN:              ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET:       ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN:   ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID:                ${{ secrets.LINE_USER_ID }}
          GITHUB_REPOSITORY:           ${{ github.repository }}
          # プレフィックス付きシークレット（マルチテナント用）
          # 追加クライアントのシークレットはここに追記
          # CLIENT_A_NOTION_TOKEN:     ${{ secrets.CLIENT_A_NOTION_TOKEN }}
          # CLIENT_A_X_API_KEY:        ${{ secrets.CLIENT_A_X_API_KEY }}
        run: |
          python "${BASE}multi_runner.py" \
            --mode generate \
            --client clients/${{ matrix.client }}.yaml

      - name: 生成した画像をリポジトリにコミット
        run: |
          git config user.name  "SNS Scheduler Bot"
          git config user.email "bot@github.com"
          git add post-images/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Add post images $(date +%Y-%m-%d) [${{ matrix.client }}]"
          git push || true
